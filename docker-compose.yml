services:
  postgres:
    image: postgres:16-alpine
    container_name: graduation-process-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: graduation_process
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d graduation_process"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
